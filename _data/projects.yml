  es:
    title: "Modelización de la estructura del parentesco: proyecciones demográficas y heterogeneidad poblacional"
    short: "Este proyecto estudia la estructura y la evolución de las redes de parentesco describiendo su tamaño y su composición por edad, sexo, tipo de pariente y otras características. Elabora proyecciones comparadas entre países de la estructura del parentesco y pone de relieve cómo el cambio demográfico y la heterogeneidad configuran el parentesco."
    research_keywords:
      - "Envejecimiento, mortalidad y longevidad"
      - "Cambio demográfico"
      - "Comportamiento familiar"
      - "Atención sanitaria"
      - "Salud pública, medicina y epidemiología"
      - "Relaciones intergeneracionales"
    region_keywords:
      - "Mundo"
    details:
      - "Los demógrafos llevan mucho tiempo proyectando los cambios en el tamaño y la composición por edad de las poblaciones, pero han prestado comparativamente poca atención a lo que estos cambios implican para la estructura de las redes familiares. Las estructuras de parentesco son fundamentales para los sistemas de apoyo informal, ya que el intercambio de cuidados, las transferencias económicas y el apoyo emocional dependen de la disponibilidad de familiares vivos. Por ello, comprender cómo el cambio demográfico transforma las redes de parentesco es esencial para anticipar la distribución de los cuidados y del apoyo en las sociedades."
      - "Los avances recientes en la demografía del parentesco permiten modelar el número, el sexo y la estructura por edad de los parientes biológicos mediante métodos de demografía formal. Estos modelos muestran cómo los cambios en la fecundidad, la mortalidad y la migración transforman las redes familiares a lo largo de las generaciones y del tiempo. Por ejemplo, el descenso sostenido de la fecundidad reduce la prevalencia de parientes horizontales, como hermanos y primos, mientras que las mejoras en la mortalidad aumentan la probabilidad de que las personas compartan años de vida con sus parientes ascendientes y descendientes. Estos procesos modifican el equilibrio entre parientes verticales y horizontales y alteran la estructura de las posibles redes de apoyo dentro de las familias."
      - "El proyecto consta de dos componentes complementarios. El primero elabora proyecciones demográficas de las estructuras de parentesco. A partir de los avances recientes en la demografía del parentesco, el proyecto genera proyecciones de los familiares nucleares y extensos para todos los países a lo largo del siglo XXI (padres, hermanos, hijos, abuelos, nietos, tíos, sobrinos y primos). Estas proyecciones describen el número y la composición esperados de los familiares según la edad, el sexo y el tipo de pariente. Permiten examinar cómo el cambio demográfico transforma las estructuras de parentesco en distintas poblaciones."
      - "El segundo componente examina cómo la heterogeneidad de la población configura las estructuras de parentesco. La mayoría de los modelos de parentesco existentes tratan a las poblaciones como demográficamente homogéneas, aunque los procesos demográficos están profundamente estratificados. El descenso de la fecundidad suele producirse antes entre las personas con un nivel educativo alto y en las cohortes más jóvenes. Además, las mejoras en la mortalidad varían entre grupos socioeconómicos y entre hombres y mujeres, y la migración reestructura las redes familiares de formas distintas según las regiones y las poblaciones. Estos procesos generan una variación considerable en las estructuras de parentesco, tanto entre grupos demográficos como dentro de las poblaciones."
      - "Para captar esta complejidad, el proyecto integra las proyecciones de parentesco con una modelización explícita de la heterogeneidad demográfica. Se apoya en los avances metodológicos de los modelos demográficos de parentesco y de la microsimulación estocástica para representar dos fuentes de variación complementarias: las diferencias estructuradas entre grupos demográficos definidos por atributos como la edad, el sexo, el nivel educativo o el lugar de residencia; y la variabilidad dentro de los grupos derivada de la estocasticidad demográfica y de la variación individual en el curso de vida."
      - "La combinación de proyecciones demográficas con modelos de heterogeneidad poblacional permite ir más allá de las estimaciones del número medio de familiares y desvelar la distribución de las estructuras de parentesco entre individuos y grupos. Los análisis resultantes ofrecen un marco para comprender cómo el cambio demográfico transforma las redes familiares en las distintas sociedades y cómo evoluciona la disponibilidad potencial de apoyo basado en el parentesco en un contexto de envejecimiento de la población y de cambios en los patrones familiares."
