- id: migration-kin
  title: "Analyzing Migration Behavior From the Perspective of Kin (Dissertation)"
  menu_title: "Migration From the Perspective of Kin"
  short: "This project analyzes the influence of kin networks on individuals' migration behaviors and migration patterns across countries, time, and generations by combining established and novel data sources and methods."
  research_keywords:
    - "Family Behavior"
    - "Historical Demography"
    - "Intergenerational Relationships"
    - "Life Course"
    - "Migration"
  region_keywords:
    - "Europe"
    - "Netherlands"
    - "USA"
  mpidr_url: "https://www.demogr.mpg.de/en/research_6120/independent_research_groups_11668/kinship_inequalities_10703/analyzing_migration_behavior_from_the_perspective_of_kin_dissertation_11949"
  collaborators:
    - name: "Andrea Colasurdo"
      url: "https://www.demogr.mpg.de/en/about_us_6113/staff_directory_1899/andrea_colasurdo_4275"
      affiliation: "MPIDR / University of Groningen, Netherlands"
    - name: "Clara H. Mulder"
      affiliation: "University of Groningen, Netherlands"
  dissertation_student: "Andrea Colasurdo"
  dissertation_cosupervisor: "Clara H. Mulder"
  details:
    - "Focusing on kinship networks can help us better understand how and why people migrate. Family ties shape individual migration decisions, and migration behaviors have important implications for individuals and families in areas of departure and arrival."
    - "We evaluate the impact of kin networks on migration behavior. Our first objective is to describe how transnational kin networks are distributed across countries, and how they develop over time. Our second objective is to analyze the effect of the mobility of relatives on the likelihood of an individual migrating, and the different trajectories and behaviors that this individual may experience during his or her lifetime."
    - "Richer data about individuals and their ancestors and descendants are now available thanks to the increasing availability of linked census data as well as genealogical and historical databases. This enables us to consider more generations and longer time frames. The project uses data sources that allow us to study family networks across country borders, such as genealogical data, and data sources with more complete and detailed demographic information across multiple generations, such as historical registers."
    - "Previous studies have highlighted the role that kinship ties plays in individual decisions to move internally or internationally. However, existing research has rarely addressed how the influence of family networks on an individual’s migration behavior has evolved over time, or how the propensity to migrate is transmitted over generations. The project fills this gap by incorporating long-term analysis that covers a larger number of generations and relatives in the extended family. The project thus goes beyond the usual two-generation approach, which focuses only on the influence of parents on their offspring, by assessing the influence of siblings and more distant relatives on individual migration decisions."
    - "Future work can build on findings from this project to gain deeper insights into migration behavior, taking into account family networks as well as their migration patterns and outcomes. The project provides insights into the consequences of migration for families and family support. It will also improve our understanding of how datasets with detailed genealogical information can be used for demographic research."
  de:
    mpidr_url: "https://www.demogr.mpg.de/de/forschung_6120/unabhaengige_forschungsgruppen_11668/ungleichheiten_in_verwandtschaftsbeziehungen_10703/analyzing_migration_behavior_from_the_perspective_of_kin_dissertation_11949"
    research_keywords:
      - "Familienverhalten"
      - "Historische Demografie"
      - "intergenerationelle Beziehungen"
      - "Lebensverlauf"
      - "Migration"
    region_keywords:
      - "Europa"
      - "Niederlande"
      - "Vereinigte Staaten"
    short: "Dieses Projekt analysiert, wie Verwandtschaftsnetzwerke das Migrationsverhalten von Individuen sowie Migrationsmuster über Länder, Zeiträume und Generationen hinweg beeinflussen, und verbindet dazu etablierte und neuartige Datenquellen und Methoden."
    details:
      - "Der Blick auf Verwandtschaftsnetzwerke kann helfen, besser zu verstehen, wie und warum Menschen migrieren. Familiäre Bindungen prägen individuelle Migrationsentscheidungen, und das Migrationsverhalten hat wichtige Folgen für Individuen und Familien in den Herkunfts- und Zielgebieten."
      - "Wir untersuchen den Einfluss von Verwandtschaftsnetzwerken auf das Migrationsverhalten. Unser erstes Ziel ist es, zu beschreiben, wie sich transnationale Verwandtschaftsnetzwerke über Länder verteilen und wie sie sich im Zeitverlauf entwickeln. Unser zweites Ziel ist es, zu analysieren, wie sich die Mobilität von Verwandten auf die Wahrscheinlichkeit auswirkt, dass eine Person migriert, und auf die unterschiedlichen Verläufe und Verhaltensweisen, die diese Person im Laufe ihres Lebens erfahren kann."
      - "Dank der zunehmenden Verfügbarkeit verknüpfter Zensusdaten sowie genealogischer und historischer Datenbanken stehen heute reichhaltigere Daten über Individuen und ihre Vorfahren und Nachkommen zur Verfügung. Dadurch können wir mehr Generationen und längere Zeiträume berücksichtigen. Das Projekt nutzt Datenquellen, mit denen sich Familiennetzwerke über Ländergrenzen hinweg untersuchen lassen, etwa genealogische Daten, sowie Datenquellen mit vollständigeren und detaillierteren demografischen Informationen über mehrere Generationen, etwa historische Register."
      - "Frühere Studien haben hervorgehoben, welche Rolle verwandtschaftliche Bindungen für individuelle Entscheidungen zur Binnen- oder internationalen Migration spielen. Die bisherige Forschung hat sich jedoch kaum damit befasst, wie sich der Einfluss familiärer Netzwerke auf das Migrationsverhalten eines Individuums im Laufe der Zeit verändert hat oder wie die Neigung zur Migration über Generationen weitergegeben wird. Das Projekt schließt diese Lücke mit Langzeitanalysen, die eine größere Zahl von Generationen und Verwandten der erweiterten Familie einbeziehen. Damit geht das Projekt über den üblichen Zwei-Generationen-Ansatz hinaus, der sich nur auf den Einfluss der Eltern auf ihre Kinder konzentriert, und untersucht den Einfluss von Geschwistern und entfernteren Verwandten auf individuelle Migrationsentscheidungen."
      - "Künftige Arbeiten können auf den Ergebnissen dieses Projekts aufbauen, um tiefere Einblicke in das Migrationsverhalten zu gewinnen und dabei sowohl Familiennetzwerke als auch deren Migrationsmuster und -ergebnisse zu berücksichtigen. Das Projekt liefert Erkenntnisse über die Folgen von Migration für Familien und familiäre Unterstützung. Zudem verbessert es unser Verständnis davon, wie Datensätze mit detaillierten genealogischen Informationen für die demografische Forschung genutzt werden können."
