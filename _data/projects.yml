  es:
    title: "Parentesco queer y elegido: la diversidad familiar en el mundo"
    short: "El proyecto analiza las redes sociales y de parentesco de las personas queer, con especial atención a la estructura de las redes y a la calidad de las relaciones. Su objetivo es comprender los efectos a nivel individual, familiar y social sobre la solidaridad intergeneracional e intrageneracional y el intercambio de recursos entre las personas queer y sus familiares."
    research_keywords:
      - "Comportamiento familiar"
      - "Relaciones intergeneracionales"
      - "Políticas públicas, política, administración, Estado de bienestar"
      - "Estadística y matemáticas"
    region_keywords:
      - "Europa"
      - "Estados Unidos"
      - "Mundo"
    details:
      - "Tras décadas de cambios en la formación de parejas y en la fecundidad, la diversidad familiar (es decir, las formas familiares que existen fuera de la familia nuclear heterosexual casada) se ha convertido en un tema central tanto para la investigación como para los responsables políticos. Estas formas familiares incluyen las parejas que cohabitan con o sin hijos, las familias multigeneracionales, las personas solteras y las familias monoparentales, las familias reconstituidas y las parejas y progenitores del mismo sexo. Sin embargo, en el caso de este último grupo, la investigación existente mantiene un enfoque relativamente estrecho en las personas queer con pareja (es decir, quienes se identifican como lesbianas, gais, bisexuales o queer, o con otra orientación no heterosexual). El proyecto amplía este enfoque al situar en el centro las redes sociales y de parentesco de las personas queer, y aporta así un conjunto más sólido de evidencia sociológica y demográfica sobre los familiares queer y la familia elegida."
      - "El proyecto replantea quién cuenta como familiar y cómo viven las personas el parentesco. Los términos «familia» y «parientes» se emplean aquí indistintamente para referirse a las relaciones basadas en vínculos biológicos o legales (p. ej., adopción, matrimonio), e incluyen tanto la familia nuclear (es decir, padres e hijos) como las relaciones de la familia extensa (p. ej., primos, abuelos). El proyecto distingue entre parientes «elegidos» y «no elegidos»: los primeros constituyen una red no biológica y no legal que proporciona un apoyo similar al que suele ofrecer una familia, aunque sin duda muchos parientes «no elegidos» también pueden formar parte de una «familia elegida»."
      - "El primer objetivo de este proyecto es comprender los lazos y las relaciones familiares de las personas queer. Aunque hay un conjunto creciente de investigaciones sobre la influencia que los parientes de la familia extensa, y en particular las tías y los primos, tienen en la vida de las personas queer, se sabe poco sobre cuántos parientes queer puede esperar tener una persona, o sobre cómo varía este número según el tipo de pariente y el género. Además, la calidad de los lazos familiares de las personas queer (incluido el intercambio de recursos, apoyo y cuidados) no se conoce bien, especialmente en el contexto europeo. El proyecto aporta nueva evidencia sobre el parentesco queer, tanto cuantificando (es decir, determinando el número y la estructura) como cualificando (es decir, investigando las transferencias de recursos y cuidados, la calidad de las relaciones y el apoyo intergeneracional e intrageneracional) las redes de parentesco extenso de las personas queer."
      - "El segundo objetivo es investigar el papel que desempeñan los parientes elegidos en la vida de las personas queer. Aunque la aceptación de las minorías sexuales crece en todo el mundo, las personas queer siguen sufriendo tasas más altas de distanciamiento familiar y exclusión social que las personas heterosexuales, lo que a menudo se traduce en una mayor dependencia de la familia elegida. El proyecto amplía la investigación previa al examinar el papel de los parientes elegidos en distintas etapas de la vida y en diferentes contextos sociales y jurídicos."
      - "En un contexto de envejecimiento de la población y de reducción de las estructuras de parentesco, el proyecto «Parentesco queer y elegido» muestra cómo el apoyo y la solidaridad pueden existir fuera de la familia nuclear heterosexual. Sus resultados pueden servir de base para políticas orientadas a una mayor inclusión de las diversas formas familiares. Además, el proyecto hace avanzar nuestra comprensión teórica del papel que desempeña el entorno social y jurídico en la configuración de los lazos sociales y de parentesco de las personas queer en distintos contextos."
