- id: kinship-structure
  title: "Modeling Kinship Structure: Demographic Projections and Population Heterogeneity"
  menu_title: "Modeling Kinship Structure"
  short: "This project studies the structure and evolution of kinship networks by describing their size and composition by age, sex, type of kin, and other characteristics. It produces cross-national projections of kinship structure, emphasizing how kinship is shaped by demographic change and heterogeneity."
  research_keywords:
    - "Aging, Mortality and Longevity"
    - "Demographic Change"
    - "Family Behavior"
    - "Health Care"
    - "Public Health, Medicine, and Epidemiology"
    - "Intergenerational Relationships"
  region_keywords:
    - "World"
  mpidr_url: "https://www.demogr.mpg.de/en/research_6120/independent_research_groups_11668/kinship_inequalities_10703/modeling_kinship_structure_demographic_projections_and_population_heterogeneity_13761"
  collaborators:
    - name: "Sha Jiang"
      url: "https://www.demogr.mpg.de/en/about_us_6113/staff_directory_1899/sha_jiang_4369"
    - name: "Saroja Adhikari"
      url: "https://www.demogr.mpg.de/en/about_us_6113/staff_directory_1899/saroja_adhikari_4434"
    - name: "Bettina Maria Hünteler"
      url: "https://www.demogr.mpg.de/en/about_us_6113/staff_directory_1899/bettina_maria_huenteler_4318"
    - name: "Elena Pojman"
      url: "https://www.demogr.mpg.de/en/about_us_6113/staff_directory_1899/elena_pojman_4416"
  details:
    - "Demographers have long projected shifts in the size and age composition of populations, but have paid comparatively little attention to the question of what these changes imply for the structure of family networks. Kinship structures are fundamental to systems of informal support because the exchange of care, financial transfers, and emotional assistance depends on the availability of living relatives. Understanding how demographic change reshapes kinship networks is therefore essential for anticipating the distribution of care and support within societies."
    - "Recent advances in kinship demography make it possible to model the number, sex, and age structure of biological kin using formal demographic methods. These models show how shifts in fertility, mortality, and migration reshape family networks across generations and over time. For example, sustained fertility decline reduces the prevalence of horizontal kin such as siblings and cousins, while mortality improvements increase the likelihood that individuals will share overlapping lifetimes with ascendant and descendant kin. These processes reshape the balance between vertical and horizontal kin and alter the structure of potential support networks within families."
    - "The project consists of two complementary components. The first component produces demographic projections of kinship structures. Building on recent developments in kinship demography, the project generates projections of nuclear and extended kin for all countries over the 21st century (considering parents, siblings, children, grandparents, grandchildren, aunts and uncles, nieces and nephews, and cousins). These projections describe the expected number and composition of kin by age, sex, and type of kin. They allow us to examine how demographic change reshapes kin structures across populations."
    - "The second component examines how population heterogeneity shapes kinship structures. Most existing kinship models treat populations as demographically homogeneous, even though demographic processes are deeply stratified. Fertility declines often occur earlier among highly educated individuals and younger cohorts. Moreover, mortality improvements vary across socioeconomic groups and between men and women, and migration restructures family networks in ways that differ across regions and populations. These processes generate substantial variation in kinship structures both between demographic groups and within populations."
    - "To capture this complexity, the project integrates kinship projections with explicit modeling of demographic heterogeneity. It draws on methodological advances in demographic kinship models and stochastic microsimulation to represent two complementary sources of variation: structured differences between demographic groups defined by attributes such as age, sex, education, or place of residence; and within-group variability arising from demographic stochasticity and individual-level life course variation."
    - "Combining demographic projections with models of population heterogeneity makes it possible to move beyond estimates of average kin counts to uncover the distribution of kinship structures across individuals and groups. The resulting analyses provide a framework for understanding how demographic change reshapes family networks across societies, and how the potential availability of kin-based support evolves in the context of population aging and changing family patterns."
  de:
    mpidr_url: "https://www.demogr.mpg.de/de/forschung_6120/unabhaengige_forschungsgruppen_11668/ungleichheiten_in_verwandtschaftsbeziehungen_10703/modeling_kinship_structure_demographic_projections_and_population_heterogeneity_13761"
    research_keywords:
      - "Alterung, Sterblichkeit und Langlebigkeit"
      - "Demografischer Wandel"
      - "Familienverhalten"
      - "Gesundheitsversorgung"
      - "Public Health, Medizin und Epidemiologie"
      - "intergenerationelle Beziehungen"
    region_keywords:
      - "Welt"
    short: "Dieses Projekt untersucht die Struktur und Entwicklung von Verwandtschaftsnetzwerken, indem es deren Größe und Zusammensetzung nach Alter, Geschlecht, Verwandtschaftstyp und weiteren Merkmalen beschreibt. Es erstellt länderübergreifende Projektionen der Verwandtschaftsstruktur und zeigt dabei, wie Verwandtschaft durch demografischen Wandel und Heterogenität geprägt wird."
    details:
      - "Demografinnen und Demografen projizieren seit Langem Veränderungen in der Größe und Altersstruktur von Bevölkerungen, haben aber der Frage, was diese Veränderungen für die Struktur familiärer Netzwerke bedeuten, vergleichsweise wenig Aufmerksamkeit geschenkt. Verwandtschaftsstrukturen sind grundlegend für informelle Unterstützungssysteme, denn der Austausch von Pflege, finanziellen Transfers und emotionalem Beistand hängt davon ab, ob lebende Verwandte vorhanden sind. Zu verstehen, wie der demografische Wandel Verwandtschaftsnetzwerke umgestaltet, ist daher unerlässlich, um die Verteilung von Pflege und Unterstützung innerhalb von Gesellschaften vorausschauend abschätzen zu können."
      - "Neuere Fortschritte in der Verwandtschaftsdemografie ermöglichen es, die Zahl sowie die Geschlechts- und Altersstruktur biologischer Verwandter mit Methoden der formalen Demografie zu modellieren. Diese Modelle zeigen, wie Veränderungen von Fertilität, Sterblichkeit und Migration familiäre Netzwerke über Generationen hinweg und im Zeitverlauf umformen. So verringert ein anhaltender Geburtenrückgang die Verbreitung horizontaler Verwandter wie Geschwister sowie Cousins und Cousinen, während sinkende Sterblichkeit die Wahrscheinlichkeit erhöht, dass Menschen einen Teil ihrer Lebenszeit gemeinsam mit Verwandten in auf- und absteigender Linie verbringen. Diese Prozesse verschieben das Gleichgewicht zwischen vertikalen und horizontalen Verwandten und verändern die Struktur potenzieller Unterstützungsnetzwerke innerhalb von Familien."
      - "Das Projekt besteht aus zwei sich ergänzenden Teilen. Der erste Teil erstellt demografische Projektionen von Verwandtschaftsstrukturen. Aufbauend auf neueren Entwicklungen in der Verwandtschaftsdemografie erzeugt das Projekt Projektionen der Kernfamilie und der erweiterten Verwandtschaft für alle Länder über das 21. Jahrhundert (berücksichtigt werden Eltern, Geschwister, Kinder, Großeltern, Enkelkinder, Tanten und Onkel, Nichten und Neffen sowie Cousins und Cousinen). Diese Projektionen beschreiben die erwartete Zahl und Zusammensetzung von Verwandten nach Alter, Geschlecht und Verwandtschaftstyp. Sie ermöglichen es, zu untersuchen, wie der demografische Wandel Verwandtschaftsstrukturen in unterschiedlichen Bevölkerungen umgestaltet."
      - "Der zweite Teil untersucht, wie Bevölkerungsheterogenität Verwandtschaftsstrukturen prägt. Die meisten bestehenden Verwandtschaftsmodelle behandeln Bevölkerungen als demografisch homogen, obwohl demografische Prozesse stark sozial geschichtet sind. Der Geburtenrückgang setzt bei Hochgebildeten und jüngeren Kohorten häufig früher ein. Zudem unterscheiden sich Verbesserungen der Sterblichkeit zwischen sozioökonomischen Gruppen sowie zwischen Männern und Frauen, und Migration verändert familiäre Netzwerke je nach Region und Bevölkerung auf unterschiedliche Weise. Diese Prozesse führen zu erheblichen Unterschieden in den Verwandtschaftsstrukturen, sowohl zwischen demografischen Gruppen als auch innerhalb von Bevölkerungen."
      - "Um diese Komplexität abzubilden, verbindet das Projekt Verwandtschaftsprojektionen mit einer expliziten Modellierung demografischer Heterogenität. Es stützt sich auf methodische Fortschritte bei demografischen Verwandtschaftsmodellen und in der stochastischen Mikrosimulation, um zwei sich ergänzende Quellen von Variation darzustellen: strukturelle Unterschiede zwischen demografischen Gruppen, die durch Merkmale wie Alter, Geschlecht, Bildung oder Wohnort definiert sind, sowie die Variabilität innerhalb von Gruppen, die aus demografischer Stochastizität und individuellen Unterschieden im Lebensverlauf entsteht."
      - "Die Verbindung demografischer Projektionen mit Modellen der Bevölkerungsheterogenität ermöglicht es, über Schätzungen der durchschnittlichen Zahl von Verwandten hinauszugehen und die Verteilung von Verwandtschaftsstrukturen über Individuen und Gruppen hinweg sichtbar zu machen. Die daraus hervorgehenden Analysen bieten einen Rahmen, um zu verstehen, wie der demografische Wandel familiäre Netzwerke in verschiedenen Gesellschaften umgestaltet und wie sich die potenzielle Verfügbarkeit verwandtschaftlicher Unterstützung vor dem Hintergrund der Bevölkerungsalterung und sich wandelnder Familienmuster entwickelt."
