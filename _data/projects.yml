- id: years-we-share
  title: "The Years We Share: Mother-Child Shared Lifetime, Health, and Intergenerational Transfers"
  menu_title: "The Years We Share"
  short: "This dissertation explores the mother-child dyad from a demographic perspective, focusing on how the overlap of maternal and child life courses relates to bidirectional intergenerational support."
  research_keywords:
    - "Family Behavior"
  region_keywords:
    - "Brazil"
    - "Denmark"
  mpidr_url: "https://www.demogr.mpg.de/en/research_6120/independent_research_groups_11668/kinship_inequalities_10703/the_years_we_share_mother_child_shared_lifetime_health_and_intergenerational_transfers_12753"
  collaborators:
    - name: "Amanda Martins de Almeida"
      url: "https://www.demogr.mpg.de/en/about_us_6113/staff_directory_1899/amanda_martins_de_almeida_4265"
    - name: "Cosmo Strozza"
      url: "https://www.sdu.dk/en/forskning/forskningsenheder/samf/cpop/about_the_centre/our_people/cpop/cosmo_strozza"
      affiliation: "Interdisciplinary Centre on Population Dynamics (CPop), University of Southern Denmark"
  dissertation_student: "Amanda Martins de Almeida"
  dissertation_cosupervisor: "Cosmo Strozza"
  details:
    - "Family networks provide essential support, resources, and socialization throughout the life course. The \"linked lives\" perspective emphasizes that the advantages or disadvantages experienced by one family member affect others. This perspective also stresses the mutual nature of these ties: mothers impact their children, and conversely, children affect maternal outcomes. However, most research has focused on maternal effects on children, leaving the reverse pathway and the temporal dimension of intergenerational exchange largely unexplored."
    - "This dissertation fills this gap by examining the demographic constraints for mothers and children to support each other, as well as the direction of support from children to mothers. Longer periods of shared lifetime imply greater opportunities for mutual support. Furthermore, the mother's health during those shared years is important. When she is healthy, the relationship can involve reciprocal caregiving. When she is unhealthy, the child's ability to provide care becomes a critical source of support. By highlighting the duration of the mother–child overlap and the mother's health during that period, this study paves the way for a more comprehensive analysis of the mother–child relationship's potential in providing care and resources."
    - "The first paper investigates the impact of children's education on maternal survival in Chile. We use the orphanhood method to estimate maternal mortality based on reports of parental survival from children. We find that higher educational achievement among adult children is associated with better maternal survival, particularly among mothers with a low level of education. This suggests that educated children may provide health knowledge, financial support, or care that improves their mothers' chances of living longer."
    - "The second paper introduces two new demographic indicators: Shared Lifetime (SLT), the average number of years a mother and child are alive at the same time, and Years of Shared Life Lost (YSLL), the years lost due to death. We estimate these measures for every country using formal models, age-specific fertility rates, and life tables from the United Nations World Population Prospects (1950–2023). The results demonstrate a universal increase in SLT over time; however, substantial cross-national disparities persist. These patterns highlight the impact of variations in fertility and mortality dynamics on the amount of time that mothers and children can spend together and have significant implications for intergenerational support."
    - "The third paper builds on the Shared Lifetime concept by introducing the Healthy Shared Lifetime (HSLT), which estimates the number of years that a mother and child share while the mother is in good health. Using Danish registry data linking kinship records with national health information, we calculate the HSLT for mother-child dyads. This method distinguishes years spent in good health from years spent in health versus illness, offering a more nuanced understanding of the quality of time spent within the family unit."
    - "This dissertation advances the study of intergenerational family transfer dynamics, offering researchers and policymakers a concise framework to evaluate the potential of mutual mother-child support. This framework has significant implications for mitigating health disparities and promoting well-being across generations."
  de:
    mpidr_url: "https://www.demogr.mpg.de/de/forschung_6120/unabhaengige_forschungsgruppen_11668/ungleichheiten_in_verwandtschaftsbeziehungen_10703/the_years_we_share_mother_child_shared_lifetime_health_and_intergenerational_transfers_12753"
    research_keywords:
      - "Familienverhalten"
    region_keywords:
      - "Brasilien"
      - "Dänemark"
    short: "Diese Dissertation betrachtet die Mutter-Kind-Dyade aus demografischer Perspektive und untersucht, wie die Überschneidung der Lebensverläufe von Mutter und Kind mit wechselseitiger intergenerationeller Unterstützung zusammenhängt."
    details:
      - "Familiennetzwerke bieten im gesamten Lebensverlauf wesentliche Unterstützung, Ressourcen und Sozialisation. Die Perspektive der „verbundenen Leben“ (linked lives) betont, dass sich die Vor- oder Nachteile, die ein Familienmitglied erfährt, auch auf andere auswirken. Sie unterstreicht zudem die Wechselseitigkeit dieser Bindungen: Mütter beeinflussen ihre Kinder, und umgekehrt wirken sich Kinder auf die Lebenslagen ihrer Mütter aus. Die meisten Studien haben sich jedoch auf die Effekte der Mütter auf ihre Kinder konzentriert, sodass der umgekehrte Wirkungsweg und die zeitliche Dimension des intergenerationellen Austauschs weitgehend unerforscht geblieben sind."
      - "Diese Dissertation schließt diese Lücke, indem sie die demografischen Rahmenbedingungen dafür untersucht, dass Mütter und Kinder sich gegenseitig unterstützen können, und dabei auch die Unterstützung von Kindern für ihre Mütter in den Blick nimmt. Längere gemeinsame Lebenszeit bedeutet mehr Gelegenheiten zu gegenseitiger Unterstützung. Darüber hinaus spielt die Gesundheit der Mutter in diesen gemeinsamen Jahren eine wichtige Rolle. Ist sie gesund, kann die Beziehung wechselseitige Fürsorge umfassen. Ist sie es nicht, wird die Fähigkeit des Kindes, Pflege zu leisten, zu einer entscheidenden Quelle der Unterstützung. Indem die Studie die Dauer der gemeinsamen Lebenszeit von Mutter und Kind und die Gesundheit der Mutter in diesem Zeitraum hervorhebt, ebnet sie den Weg für eine umfassendere Analyse des Potenzials der Mutter-Kind-Beziehung, Pflege und Ressourcen bereitzustellen."
      - "Der erste Artikel untersucht den Einfluss der Bildung von Kindern auf das Überleben ihrer Mütter in Chile. Wir verwenden die Waisenmethode (orphanhood method), um die Sterblichkeit von Müttern anhand der Angaben von Kindern zum Überleben ihrer Eltern zu schätzen. Wir stellen fest, dass ein höheres Bildungsniveau erwachsener Kinder mit einem besseren Überleben der Mütter einhergeht, insbesondere bei Müttern mit niedrigem Bildungsniveau. Dies deutet darauf hin, dass gebildete Kinder Gesundheitswissen, finanzielle Unterstützung oder Pflege bereitstellen, die die Chancen ihrer Mütter auf ein längeres Leben verbessern."
      - "Der zweite Artikel führt zwei neue demografische Indikatoren ein: die gemeinsame Lebenszeit (Shared Lifetime, SLT), also die durchschnittliche Zahl der Jahre, in denen Mutter und Kind gleichzeitig leben, und die verlorenen Jahre gemeinsamen Lebens (Years of Shared Life Lost, YSLL), also die durch Tod verlorenen Jahre. Wir schätzen diese Maße für jedes Land mithilfe formaler Modelle, altersspezifischer Fertilitätsraten und Sterbetafeln aus den World Population Prospects der Vereinten Nationen (1950–2023). Die Ergebnisse zeigen einen universellen Anstieg der SLT im Zeitverlauf, doch es bestehen weiterhin erhebliche Unterschiede zwischen den Ländern. Diese Muster verdeutlichen, wie sich Unterschiede in der Fertilitäts- und Sterblichkeitsdynamik auf die Zeit auswirken, die Mütter und Kinder miteinander verbringen können, und haben erhebliche Implikationen für die intergenerationelle Unterstützung."
      - "Der dritte Artikel baut auf dem Konzept der gemeinsamen Lebenszeit auf und führt die gesunde gemeinsame Lebenszeit (Healthy Shared Lifetime, HSLT) ein, die schätzt, wie viele Jahre Mutter und Kind miteinander teilen, während die Mutter bei guter Gesundheit ist. Anhand dänischer Registerdaten, die Verwandtschaftsinformationen mit nationalen Gesundheitsdaten verknüpfen, berechnen wir die HSLT für Mutter-Kind-Dyaden. Dieser Ansatz unterscheidet die gemeinsamen Jahre, in denen die Mutter gesund ist, von denen, in denen sie krank ist, und ermöglicht so ein differenzierteres Verständnis der Qualität der gemeinsam in der Familie verbrachten Zeit."
      - "Diese Dissertation trägt zur Erforschung der Dynamik intergenerationeller Transfers in Familien bei und bietet Forschenden sowie politischen Entscheidungsträgerinnen und -trägern einen prägnanten Rahmen, um das Potenzial gegenseitiger Unterstützung zwischen Mutter und Kind zu bewerten. Dieser Rahmen hat wichtige Implikationen für den Abbau gesundheitlicher Ungleichheiten und die Förderung des Wohlbefindens über Generationen hinweg."
    translated_by_ai: true
  es:
    title: "Los años que compartimos: tiempo de vida compartido entre madres e hijos, salud y transferencias intergeneracionales"
    short: "Esta tesis doctoral explora la díada madre-hijo desde una perspectiva demográfica y se centra en cómo el solapamiento de los cursos de vida de madres e hijos se relaciona con el apoyo intergeneracional bidireccional."
    research_keywords:
      - "Comportamiento familiar"
    region_keywords:
      - "Brasil"
      - "Dinamarca"
    details:
      - "Las redes familiares proporcionan apoyo, recursos y socialización esenciales a lo largo del curso de vida. La perspectiva de las «vidas vinculadas» subraya que las ventajas o desventajas que experimenta un miembro de la familia afectan a los demás. Esta perspectiva destaca también el carácter recíproco de estos lazos: las madres influyen en sus hijos y, a la inversa, los hijos influyen en los resultados de sus madres. Sin embargo, la mayor parte de la investigación se ha centrado en los efectos de las madres sobre los hijos, y la vía inversa y la dimensión temporal del intercambio intergeneracional han quedado en gran medida sin explorar."
      - "Esta tesis cubre esa laguna al examinar las restricciones demográficas que condicionan el apoyo mutuo entre madres e hijos, así como el apoyo que fluye de los hijos hacia las madres. Periodos más largos de vida compartida implican mayores oportunidades de apoyo mutuo. Además, la salud de la madre durante esos años compartidos es importante. Cuando goza de buena salud, la relación puede implicar cuidados recíprocos. Cuando no es así, la capacidad del hijo para prestar cuidados se convierte en una fuente fundamental de apoyo. Al poner de relieve la duración del solapamiento entre madre e hijo y la salud de la madre durante ese periodo, este estudio abre el camino a un análisis más completo del potencial de la relación madre-hijo para proporcionar cuidados y recursos."
      - "El primer artículo investiga el efecto de la educación de los hijos en la supervivencia materna en Chile. Utilizamos el método de orfandad para estimar la mortalidad de las madres a partir de la información que dan los hijos sobre la supervivencia de sus progenitores. Observamos que un mayor nivel educativo de los hijos adultos se asocia a una mayor supervivencia materna, sobre todo entre las madres con un nivel educativo bajo. Esto sugiere que los hijos con más estudios pueden aportar conocimientos sobre salud, apoyo económico o cuidados que mejoran las probabilidades de que sus madres vivan más tiempo."
      - "El segundo artículo introduce dos nuevos indicadores demográficos: el tiempo de vida compartido (SLT, por sus siglas en inglés), es decir, el número medio de años durante los cuales una madre y su hijo están vivos al mismo tiempo, y los años de vida compartida perdidos (YSLL), es decir, los años que se pierden a causa de la muerte. Estimamos estas medidas para todos los países mediante modelos formales, tasas de fecundidad por edad y tablas de vida de las Perspectivas de la Población Mundial (World Population Prospects) de las Naciones Unidas (1950–2023). Los resultados muestran un aumento universal del SLT a lo largo del tiempo; sin embargo, persisten disparidades considerables entre países. Estos patrones ponen de manifiesto cómo las variaciones en la dinámica de la fecundidad y la mortalidad influyen en el tiempo que madres e hijos pueden pasar juntos, y tienen implicaciones importantes para el apoyo intergeneracional."
      - "El tercer artículo amplía el concepto de tiempo de vida compartido con la introducción del tiempo de vida compartido saludable (HSLT), que estima el número de años que una madre y su hijo comparten mientras la madre goza de buena salud. Con datos de los registros administrativos daneses, que vinculan la información de parentesco con datos sanitarios nacionales, calculamos el HSLT para díadas madre-hijo. Este método distingue los años vividos con buena salud de los años vividos con enfermedad, lo que ofrece una comprensión más matizada de la calidad del tiempo compartido dentro de la unidad familiar."
      - "Esta tesis contribuye al estudio de la dinámica de las transferencias familiares intergeneracionales y ofrece a investigadores y responsables políticos un marco conciso para evaluar el potencial del apoyo mutuo entre madres e hijos. Este marco tiene implicaciones importantes para mitigar las desigualdades en salud y promover el bienestar entre generaciones."
