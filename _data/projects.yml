- id: bereavement
  title: "The Demography of Bereavement: Quantifying the Dynamics of Kin Loss"
  menu_title: "The Demography of Bereavement"
  short: "This project explores how individual deaths translate into experiences of kin loss among surviving relatives. We conceptualize bereavement as a demographic process using methods from kinship demography, and quantify its dynamics at the individual and population levels."
  research_keywords:
    - "Aging, Mortality and Longevity"
    - "Data and Surveys"
    - "Demographic Change"
    - "Intergenerational Relationships"
    - "Life Course"
  region_keywords:
    - "Colombia"
    - "Guatemala"
    - "USA"
    - "World"
  mpidr_url: "https://www.demogr.mpg.de/en/research_6120/independent_research_groups_11668/kinship_inequalities_10703/the_demography_of_bereavement_quantifying_the_dynamics_of_kin_loss_6177"
  collaborators:
    - name: "Sha Jiang"
      url: "https://www.demogr.mpg.de/en/about_us_6113/staff_directory_1899/sha_jiang_4369"
  details:
    - "Mortality research has traditionally treated death as an individual event measured through demographic rates. While this approach is essential for monitoring population-level mortality, it reveals little about how mortality is experienced by individuals. In practice, people encounter death not as a statistical rate, but rather through the loss of members of their social networks. This insight has motivated the emerging demography of bereavement, which seeks to quantify the structure and dynamics of kin loss using demographic methods."
    - "The loss of kin has long been recognized as a major life event with wide-ranging and long-lasting implications for individuals' physical and mental health. Bereavement can affect individuals differently depending on the life stage when it is experienced: Losing a parent at a young age has different consequences than losing a child in old age. Despite a sizeable literature on the individual-level effects of bereavement, which mainly focuses on orphanhood and widowhood, we know relatively little about how common bereavement is, at which ages it occurs, and how many people experience it across populations and over time."
    - "This project applies methods from kinship demography to characterize patterns of bereavement at the individual and population levels. It addresses questions such as: At what ages do women experience the loss of children? How many people lose kin each year due to drug overdoses? What proportion of a population have ever lost members of their extended family due to conflict-related mortality? In tackling these questions, the project seeks to address a significant gap in the demographic literature, in which bereavement has received comparatively little systematic attention despite its broad implications for population health."
    - "The project also develops a methodological toolkit for quantifying and describing bereavement that can be applied across contexts. This includes descriptive indicators that quantify the timing and magnitude of kin loss across the life course, as well as measures to characterize bereavement at the population level. The latter focus on two complementary dimensions: the structure of kin loss, which refers to the age-sex composition of the bereaved population at a given point in time; and the dynamics of kin loss, which captures how that composition shifts in response to demographic change. The project relies on descriptive analyses of microdata from genealogical sources, administrative registers, and household surveys, as well as demographic analyses applied to aggregate data. The latter are supported by the DemoKin R package, which is developed and maintained by members of the Kinship Inequality Research Group."
  de:
    mpidr_url: "https://www.demogr.mpg.de/de/forschung_6120/unabhaengige_forschungsgruppen_11668/ungleichheiten_in_verwandtschaftsbeziehungen_10703/the_demography_of_bereavement_quantifying_the_dynamics_of_kin_loss_6177"
    research_keywords:
      - "Alterung, Sterblichkeit und Langlebigkeit"
      - "Daten und Erhebungen"
      - "Demografischer Wandel"
      - "intergenerationelle Beziehungen"
      - "Lebensverlauf"
    region_keywords:
      - "Guatemala"
      - "Kolumbien"
      - "Vereinigte Staaten"
      - "Welt"
    short: "Dieses Projekt untersucht, wie einzelne Todesfälle bei den überlebenden Verwandten zu Erfahrungen des Verlusts von Angehörigen werden. Wir verstehen den Verlust von Angehörigen als demografischen Prozess, nutzen dafür Methoden der Verwandtschaftsdemografie und quantifizieren seine Dynamik auf individueller Ebene und auf Bevölkerungsebene."
    details:
      - "Die Mortalitätsforschung hat den Tod traditionell als individuelles Ereignis behandelt, das anhand demografischer Raten gemessen wird. Dieser Ansatz ist zwar unverzichtbar, um die Sterblichkeit auf Bevölkerungsebene zu beobachten, sagt aber wenig darüber aus, wie Menschen Sterblichkeit erleben. Tatsächlich begegnet uns der Tod nicht als statistische Rate, sondern durch den Verlust von Menschen aus unseren sozialen Netzwerken. Aus dieser Einsicht ist die junge Forschungsrichtung der Demografie des Verlusts von Angehörigen (Demography of Bereavement) hervorgegangen, die die Struktur und Dynamik des Verlusts von Verwandten mit demografischen Methoden quantifizieren will."
      - "Der Verlust von Verwandten gilt seit Langem als einschneidendes Lebensereignis mit weitreichenden und lang anhaltenden Folgen für die körperliche und psychische Gesundheit. Wie sich ein solcher Verlust auswirkt, hängt von der Lebensphase ab, in der er erlebt wird: Einen Elternteil in jungen Jahren zu verlieren, hat andere Folgen als der Verlust eines Kindes im hohen Alter. Trotz einer umfangreichen Literatur zu den individuellen Folgen des Verlusts von Angehörigen, die sich vor allem auf Verwaisung und Verwitwung konzentriert, wissen wir relativ wenig darüber, wie häufig solche Verluste sind, in welchem Alter sie auftreten und wie viele Menschen sie in verschiedenen Bevölkerungen und im Zeitverlauf erleben."
      - "Das Projekt wendet Methoden der Verwandtschaftsdemografie an, um Muster des Verlusts von Angehörigen auf individueller Ebene und auf Bevölkerungsebene zu beschreiben. Es geht Fragen nach wie: In welchem Alter erleben Frauen den Verlust von Kindern? Wie viele Menschen verlieren jedes Jahr Angehörige durch Drogenüberdosen? Welcher Anteil einer Bevölkerung hat jemals Mitglieder der erweiterten Familie durch konfliktbedingte Sterblichkeit verloren? Mit diesen Fragen will das Projekt eine erhebliche Lücke in der demografischen Literatur schließen, in der der Verlust von Angehörigen trotz seiner weitreichenden Bedeutung für die Bevölkerungsgesundheit vergleichsweise wenig systematische Aufmerksamkeit erhalten hat."
      - "Zudem entwickelt das Projekt ein methodisches Instrumentarium zur Quantifizierung und Beschreibung des Verlusts von Angehörigen, das in unterschiedlichen Kontexten eingesetzt werden kann. Dazu gehören deskriptive Indikatoren, die Zeitpunkt und Ausmaß des Verlusts von Verwandten im Lebensverlauf quantifizieren, sowie Maße, die den Verlust von Angehörigen auf Bevölkerungsebene beschreiben. Letztere richten sich auf zwei sich ergänzende Dimensionen: die Struktur des Verlusts von Verwandten, also die Alters- und Geschlechtszusammensetzung der Hinterbliebenen in einer Bevölkerung zu einem bestimmten Zeitpunkt, und die Dynamik des Verlusts von Verwandten, die erfasst, wie sich diese Zusammensetzung infolge des demografischen Wandels verschiebt. Das Projekt stützt sich auf deskriptive Analysen von Mikrodaten aus genealogischen Quellen, Verwaltungsregistern und Haushaltsbefragungen sowie auf demografische Analysen aggregierter Daten. Letztere werden durch das R-Paket DemoKin unterstützt, das von Mitgliedern der Forschungsgruppe Ungleichheiten in Verwandtschaftsbeziehungen entwickelt und gepflegt wird."
