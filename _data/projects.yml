  es:
    title: "Análisis del comportamiento migratorio desde la perspectiva del parentesco (Tesis doctoral)"
    short: "Este proyecto analiza la influencia de las redes de parentesco en el comportamiento migratorio de las personas y en los patrones migratorios entre países, a lo largo del tiempo y entre generaciones, combinando fuentes de datos y métodos consolidados y novedosos."
    research_keywords:
      - "Comportamiento familiar"
      - "Demografía histórica"
      - "Relaciones intergeneracionales"
      - "Curso de vida"
      - "Migración"
    region_keywords:
      - "Europa"
      - "Países Bajos"
      - "Estados Unidos"
    details:
      - "Centrarse en las redes de parentesco puede ayudarnos a entender mejor cómo y por qué migran las personas. Los lazos familiares influyen en las decisiones migratorias individuales, y los comportamientos migratorios tienen implicaciones importantes para las personas y las familias en las zonas de origen y de destino."
      - "Evaluamos el impacto de las redes de parentesco en el comportamiento migratorio. Nuestro primer objetivo es describir cómo se distribuyen las redes de parentesco transnacionales entre países y cómo evolucionan con el tiempo. Nuestro segundo objetivo es analizar el efecto de la movilidad de los familiares sobre la probabilidad de que una persona migre, así como sobre las distintas trayectorias y comportamientos que esa persona puede experimentar a lo largo de su vida."
      - "Hoy se dispone de datos más ricos sobre las personas y sus ascendientes y descendientes gracias a la creciente disponibilidad de datos censales enlazados y de bases de datos genealógicas e históricas. Esto permite considerar más generaciones y horizontes temporales más largos. El proyecto utiliza fuentes de datos que permiten estudiar las redes familiares más allá de las fronteras nacionales, como los datos genealógicos, y fuentes con información demográfica más completa y detallada a lo largo de varias generaciones, como los registros históricos."
      - "Estudios previos han puesto de relieve el papel que desempeñan los lazos de parentesco en las decisiones individuales de migrar dentro del propio país o al extranjero. Sin embargo, la investigación existente rara vez ha abordado cómo ha evolucionado con el tiempo la influencia de las redes familiares en el comportamiento migratorio de una persona, o cómo se transmite la propensión a migrar de una generación a otra. El proyecto cubre esta laguna incorporando un análisis de largo plazo que abarca un mayor número de generaciones y de parientes de la familia extensa. Así, va más allá del enfoque habitual de dos generaciones, centrado únicamente en la influencia de los padres sobre sus hijos, al evaluar la influencia de los hermanos y de parientes más lejanos en las decisiones migratorias individuales."
      - "Futuros trabajos podrán partir de los resultados de este proyecto para profundizar en el comportamiento migratorio, teniendo en cuenta las redes familiares, así como sus patrones y resultados migratorios. El proyecto aporta conocimiento sobre las consecuencias de la migración para las familias y el apoyo familiar. Asimismo, mejorará nuestra comprensión de cómo pueden utilizarse en la investigación demográfica los conjuntos de datos con información genealógica detallada."
