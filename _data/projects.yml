    src: "/img/projects/generational-placement.jpg"
    title: "Generational position in the life course"
    caption: "Schematic representation of how different family transition events (in italics) affect the generational placement trajectories of two hypothetical individuals. E.g., individual (a) becomes a parent after having a child and a grandparent after the birth of a grandchild. © [Adapted from Hünteler, 2022, https://doi.org/10.1016/j.alcr.2021.100450]"
  de:
    title: "Verläufe generationaler Positionen und soziale Ungleichheit"
    mpidr_url: "https://www.demogr.mpg.de/de/forschung_6120/unabhaengige_forschungsgruppen_11668/ungleichheiten_in_verwandtschaftsbeziehungen_10703/verlaeufe_generationaler_positionen_und_soziale_ungleichheit_12260"
    research_keywords:
      - "Familienverhalten"
      - "intergenerationelle Beziehungen"
      - "Lebensverlauf"
    region_keywords:
      - "Deutschland"
      - "Europa"
      - "Norwegen"
    short: "In diesem Projekt werden die Muster der generationalen Position ('generational placement') (d. h. die Rolle als Kind, Elternteil oder Großelternteil) im Hinblick auf ihren Lebensverlauf - d. h. den Zeitpunkt und die Reihenfolge, in der sie stattfinden - sowie auf ihren Zusammenhang mit sozialer Ungleichheit untersucht."
    details:
      - "Das Vorhandensein oder Nichtvorhandensein von Vorfahren und Nachkommen im Familiennetzwerk einer Person bestimmt deren generationale Position ('generational placement'): ob sie die Rolle eines Kindes, eines Elternteils und/oder eines Großelternteils innehat. Personen durchlaufen im Laufe ihres Lebens verschiedene generationale Positionen als Folge von Geburten und Todesfällen im intergenerationalen Familiensystem, welches eine fundamentale Quelle sozialer Unterstützung darstellt. Die familiären Übergänge können in verschiedenen Altersstufen (Timing) und in unterschiedlicher Reihenfolge stattfinden, was zu einer Vielzahl verschiedener Verläufe von generationalen Positionen führt ('generational placement trajectories')."
      - "Das erste Ziel des Projekts besteht darin, typische Muster von generationalen Positionsverläufen zu identifizieren und die Prävalenz dieser Muster über die Zeit und in verschiedenen europäischen Kontexten zu untersuchen. Einige Positionsverläufe sind häufiger als andere, weil sozio-historische Kontexte, die durch ihre spezifischen Institutionen und gesellschaftlichen Normen gekennzeichnet sind, bestimmte Lebensverläufe begünstigen. Bisherige Forschungsarbeiten haben nur bestimmte Familienübergänge separat untersucht oder jeweils nur zwei Generationen berücksichtigt. Es ist weniger darüber bekannt, wie sich die Struktur des intergenerationalen Familiensystems oder die Position des Einzelnen darin über die individuellen Lebensverläufe hinweg und zwischen ihnen verändert. In diesem Projekt wird ein neuartiger analytischer Ansatz zur Untersuchung intergenerationaler Familiensysteme angebracht, indem Methoden der Sequenz- und Clusteranalyse auf dieses Thema angewendet werden. Das Projekt liefert eine umfassendere Beschreibung der familialen Generationenstruktur als Prozess, d. h. als eine Abfolge mehrerer Ereignisse. Es untersucht die Variationen in den Familienverläufen über das Alter und zwischen Individuen und zeigt gleichzeitig die Folgen der makroökonomischen Fertilitäts- und Mortalitätstrends, die durch den zweiten demografischen Übergang ('Second Demographic Transition') beschrieben werden, auf der Mikroebene auf."
      - "Das zweite Ziel dieses Projekts besteht darin, die potenziellen Auswirkungen typischer Positionsverläufe auf das individuelle Wohlbefinden und die Gesundheit im späteren Leben sowie die Vermögensakkumulation über den Lebensverlauf zu untersuchen. Verwandtschaftsstrukturen können wichtige Determinanten für die Auswirkungen auf individueller Ebene sein, da die generationalen Positionen mit sozial bedingten normativen Verhaltenserwartungen einhergehen, wie z.B. (un)gesunde Lebensweise oder (un)risikoreiches Finanzinvestitionsverhalten. Frühere Forschungen haben gezeigt, dass einzelne generationale Familienübergänge (Großeltern werden) und -positionen (Großeltern sein) mit unterschiedlichen Auswirkungen auf das allgemeine Wohlbefinden, die körperliche Gesundheit oder den Erwerb von Wohneigentum, um nur einige zu nennen, verbunden zu sein scheinen. Dieses Projekt erweitert die bestehende Forschung, indem es untersucht, wie mehrere generationale Transitionen und Positionen sowie deren Zeitpunkt und Reihenfolge mit individuellen Folgen assoziiert sind. Das Projekt bietet einen breiteren Kontext für die bestehende Forschung, indem es eine umfassende Beschreibung des Familiensystems und seiner Zusammenhänge mit individuellen Folgen liefert."
      - "Die Ergebnisse dieses Projekts können genutzt werden, um strukturell anfällige Gruppen zu identifizieren und die Politik dahin zu lenken, die Akkumulation von Benachteiligungen und deren Transmission über Generationen hinweg zu verhindern. Darüber hinaus können die Ergebnisse die Weiterentwicklung der theoretischen Ansätze fördern, wie multiple familiäre Übergänge zusammenwirken und zu sozialer Ungleichheit beitragen."
    figure_title: "Generationale Position im Lebenslauf"
    figure_caption: "Schematische Darstellung, wie sich verschiedene familiäre Übergangsereignisse (kursiv) auf den Verlauf der Generationenplatzierung zweier hypothetischer Personen auswirken. Beispiel: Person (a) wird nach der Geburt eines Kindes zum Elternteil und nach der Geburt eines Enkelkindes zum Großelternteil. © [Angepasst von Hünteler, 2022, https://doi.org/10.1016/j.alcr.2021.100450]"
  es:
    title: "Trayectorias de posición generacional y desigualdad social"
    short: "Este proyecto explora los patrones de posición generacional (es decir, los roles de las personas como hijos, padres o abuelos) a lo largo del curso de vida (es decir, el momento y el orden en que se producen) y su relación con la desigualdad social."
    research_keywords:
      - "Comportamiento familiar"
      - "Relaciones intergeneracionales"
      - "Curso de vida"
    region_keywords:
      - "Europa"
      - "Alemania"
      - "Noruega"
    details:
      - "La presencia o ausencia de ascendientes y descendientes en la red familiar de una persona determina su posición generacional, es decir, si ocupa el rol de hijo, de padre o madre y/o de abuelo o abuela. A medida que envejecen, las personas transitan por distintas posiciones generacionales como resultado de los nacimientos y las defunciones en el sistema familiar intergeneracional, que constituye una fuente fundamental de apoyo social. Estas transiciones familiares pueden producirse a distintas edades (calendario) y en órdenes diferentes, lo que da lugar a una gran variedad de trayectorias de posición generacional."
      - "El primer objetivo del proyecto es identificar los patrones típicos de las trayectorias de posición generacional e investigar su prevalencia a lo largo del tiempo y en distintos contextos europeos. Algunas trayectorias de posición generacional son más comunes que otras porque los contextos sociohistóricos, caracterizados por sus instituciones y normas sociales específicas, favorecen determinados cursos de vida. La investigación previa ha estudiado transiciones familiares concretas por separado o ha considerado solo dos generaciones a la vez. Por ello, se sabe poco sobre cómo varía la estructura del sistema familiar intergeneracional, o la posición de la persona dentro de él, a lo largo de los cursos de vida individuales y entre ellos. Este proyecto presenta un enfoque analítico novedoso para el estudio de los sistemas familiares intergeneracionales mediante la aplicación de métodos de análisis de secuencias y de conglomerados. El proyecto ofrece una descripción más completa de la estructura familiar como proceso, es decir, como una secuencia de múltiples eventos. Examina las variaciones de las trayectorias familiares según la edad y entre individuos, y pone de relieve las consecuencias a nivel micro de las tendencias macro de fecundidad y mortalidad descritas en el marco de la segunda transición demográfica."
      - "El segundo objetivo es investigar las posibles consecuencias de las trayectorias típicas de posición generacional para el bienestar y la salud de las personas en etapas avanzadas de la vida, así como para su acumulación de riqueza a lo largo del curso de vida. Las estructuras de parentesco pueden ser determinantes importantes de los resultados individuales, ya que las posiciones generacionales van acompañadas de expectativas normativas de comportamiento socialmente condicionadas, como comportamientos (poco) saludables o decisiones de inversión financiera (poco) arriesgadas. La investigación previa ha demostrado que las transiciones familiares aisladas (como convertirse en abuelo o abuela) y las posiciones (como ser abuelo o abuela) se asocian a distintos resultados en el curso de vida, como el bienestar general, la salud física o la propiedad de la vivienda. Este proyecto amplía la investigación existente al examinar cómo múltiples transiciones y posiciones familiares, así como su calendario y su orden, se asocian conjuntamente con los resultados individuales. El proyecto ofrece un contexto más amplio para esta investigación al proporcionar una descripción exhaustiva del sistema familiar y de su relación con los resultados individuales."
      - "Los resultados del proyecto pueden servir para identificar grupos estructuralmente vulnerables y orientar políticas destinadas a prevenir la acumulación de desventajas y su transmisión entre generaciones. Además, pueden contribuir a avances teóricos en nuestra comprensión de cómo interactúan múltiples transiciones familiares y cómo contribuyen a la desigualdad social."
    figure_title: "Posición generacional en el curso de vida"
    figure_caption: "Representación esquemática de cómo distintos eventos de transición familiar (en cursiva) afectan a las trayectorias de posición generacional de dos individuos hipotéticos. Por ejemplo, el individuo (a) se convierte en padre o madre tras tener un hijo y en abuelo o abuela tras el nacimiento de un nieto. © [Adaptado de Hünteler, 2022, https://doi.org/10.1016/j.alcr.2021.100450]"
    translated_by_ai: true
