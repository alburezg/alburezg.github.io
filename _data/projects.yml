  es:
    title: "La demografía del duelo: cuantificación de la dinámica de la pérdida de familiares"
    short: "Este proyecto explora cómo las muertes individuales se traducen en experiencias de pérdida de familiares entre los parientes que sobreviven. Conceptualizamos el duelo como un proceso demográfico mediante métodos de la demografía del parentesco y cuantificamos su dinámica a nivel individual y poblacional."
    research_keywords:
      - "Envejecimiento, mortalidad y longevidad"
      - "Datos y encuestas"
      - "Cambio demográfico"
      - "Relaciones intergeneracionales"
      - "Curso de vida"
    region_keywords:
      - "Colombia"
      - "Guatemala"
      - "Estados Unidos"
      - "Mundo"
    details:
      - "La investigación sobre la mortalidad ha tratado tradicionalmente la muerte como un suceso individual, medido mediante tasas demográficas. Aunque este enfoque es esencial para el seguimiento de la mortalidad a nivel poblacional, revela poco sobre cómo la viven las personas. En la práctica, las personas no se encuentran con la muerte como una tasa estadística, sino a través de la pérdida de miembros de sus redes sociales. Esta idea ha impulsado la emergente demografía del duelo, que busca cuantificar la estructura y la dinámica de la pérdida de familiares con métodos demográficos."
      - "La pérdida de familiares se reconoce desde hace tiempo como un acontecimiento vital de primer orden, con consecuencias amplias y duraderas para la salud física y mental de las personas. El duelo puede afectar de forma distinta según la etapa de la vida en que se experimenta: perder a un progenitor a una edad temprana tiene consecuencias diferentes que perder a un hijo en la vejez. Pese a la abundante literatura sobre los efectos individuales del duelo, centrada sobre todo en la orfandad y la viudez, sabemos relativamente poco sobre la frecuencia del duelo, las edades a las que se produce y cuántas personas lo experimentan en distintas poblaciones y a lo largo del tiempo."
      - "Este proyecto aplica métodos de la demografía del parentesco para caracterizar los patrones de duelo a nivel individual y poblacional. Aborda preguntas como: ¿a qué edades experimentan las mujeres la pérdida de hijos? ¿Cuántas personas pierden a un familiar cada año por sobredosis de drogas? ¿Qué proporción de una población ha perdido alguna vez a miembros de su familia extensa por la mortalidad asociada a un conflicto? Al abordar estas preguntas, el proyecto busca subsanar una laguna importante en la literatura demográfica, en la que el duelo ha recibido comparativamente poca atención sistemática pese a sus amplias implicaciones para la salud de la población."
      - "El proyecto también desarrolla un conjunto de herramientas metodológicas para cuantificar y describir el duelo, aplicable en distintos contextos. Incluye indicadores descriptivos que cuantifican el calendario y la magnitud de la pérdida de familiares a lo largo del curso de vida, así como medidas para caracterizar el duelo a nivel poblacional. Estas últimas se centran en dos dimensiones complementarias: la estructura de la pérdida de familiares, que se refiere a la composición por edad y sexo de la población en duelo en un momento dado; y la dinámica de la pérdida de familiares, que recoge cómo cambia esa composición en respuesta al cambio demográfico. El proyecto se basa en análisis descriptivos de microdatos procedentes de fuentes genealógicas, registros administrativos y encuestas de hogares, así como en análisis demográficos aplicados a datos agregados. Estos últimos se apoyan en el paquete de R DemoKin, desarrollado y mantenido por miembros del Grupo de Investigación sobre Desigualdades de Parentesco."
    translated_by_ai: true
- id: queer-kinship
  title: "Queer and Chosen Kinship: Family Diversity Across the Globe"
  menu_title: "Queer and Chosen Kinship"
  short: "The project considers the social and kinship networks of queer people, focusing on network structure and relationship quality. It aims to understand the individual-, family-, and society-level impacts on inter- and intragenerational solidarity and resource exchange between queer people and their kin."
  research_keywords:
    - "Family Behavior"
    - "Intergenerational Relationships"
    - "Policies, Politics, Administration, Welfare State"
    - "Statistics and Mathematics"
  region_keywords:
    - "Europe"
    - "USA"
    - "World"
  mpidr_url: "https://www.demogr.mpg.de/en/research_6120/independent_research_groups_11668/kinship_inequalities_10703/queer_and_chosen_kinship_family_diversity_across_the_globe_14847"
  collaborators:
    - name: "Elena Pojman"
      url: "https://www.demogr.mpg.de/en/about_us_6113/staff_directory_1899/elena_pojman_4416"
  details:
    - "After decades of shifts in partnering and childbearing, family diversity (i.e., family forms that exist outside of the married heterosexual nuclear family) has become a key focus of researchers and policymakers alike. Such family forms include cohabiting couples with or without children, multigenerational families, single people and parents, blended and stepfamilies, and same-sex couples and parents. However, for the latter group, the existing research maintains a relatively narrow focus on partnered queer people (i.e., those who identify as lesbian, gay, bisexual, or queer, or as having another non-heterosexual orientation). The project broadens this focus by centering instead the social and kinship networks of queer people, thus providing an improved body of sociological and demographic evidence on queer and chosen kin."
    - "The project rethinks who counts as kin and how individuals experience kinship. The terms “family” and “kin” are used interchangeably here to refer to relationships formed by either biological or legal ties (e.g., adoption, marriage), and they are inclusive of nuclear family (i.e., parents and children) and extended family relationships (e.g., cousins, grandparents). The project differentiates between “chosen” and “nonchosen” kin, with the former referring to a nonbiological, nonlegal network that provides support similar to that typically offered by a family – though it is certainly also the case many “nonchosen” kin may form part of a “chosen family.”"
    - "The first aim of this project is to understand the family ties and relationships of queer people. While there is a growing body of research on the influence that extended kin, and particularly aunts and cousins, have in the lives of queer people, little is known about the number of queer kin an individual can expect to have, or how this number varies by kin type and gender. Additionally, the quality of queer people’s family ties (including the exchange of resources, support, and care) is not well understood, particularly in the European context. The project provides new evidence on queer kinship, both quantifying (i.e., determining the number and structure) and qualifying (i.e., investigating resource and care transfers, relationship quality, and inter- and intragenerational support) the extended kinship networks of queer people."
    - "The second aim is to investigate the roles chosen kin play in the lives of queer people. Although acceptance of sexual minorities is growing worldwide, queer people continue to experience higher rates of family estrangement and social exclusion than their heterosexual counterparts, and this often translates into greater reliance on chosen kin. The project extends previous research by investigating the role of chosen kin across different life stages and social and legal contexts."
    - "Amid population aging and shrinking kinship structures, the project \"Queer and Chosen Kinship\" demonstrates how support and solidarity can exist outside of the heterosexual nuclear family. Its findings can be used to inform policy directed at greater inclusion of diverse family forms. Further, the project advances our theoretical understanding of the role the social and legal landscape plays in shaping queer people’s social and kinship ties across contexts."
  de:
    mpidr_url: "https://www.demogr.mpg.de/de/forschung_6120/unabhaengige_forschungsgruppen_11668/ungleichheiten_in_verwandtschaftsbeziehungen_10703/queer_and_chosen_kinship_family_diversity_across_the_globe_14847"
    research_keywords:
      - "Familienverhalten"
      - "intergenerationelle Beziehungen"
      - "politische Maßnahmen, Politik, Verwaltung, Wohlfahrtsstaat"
      - "Statistik und Mathematik"
    region_keywords:
      - "Europa"
      - "Vereinigte Staaten"
      - "Welt"
    short: "Das Projekt untersucht die sozialen und verwandtschaftlichen Netzwerke queerer Menschen mit Blick auf Netzwerkstruktur und Beziehungsqualität. Ziel ist es, zu verstehen, wie sich Faktoren auf individueller, familiärer und gesellschaftlicher Ebene auf die inter- und intragenerationelle Solidarität sowie den Austausch von Ressourcen zwischen queeren Menschen und ihren Verwandten auswirken."
    details:
      - "Nach Jahrzehnten des Wandels bei Partnerschaft und Elternschaft ist familiäre Vielfalt (d. h. Familienformen jenseits der verheirateten heterosexuellen Kernfamilie) zu einem zentralen Thema für Forschung und Politik gleichermaßen geworden. Zu diesen Familienformen gehören nichteheliche Lebensgemeinschaften mit oder ohne Kinder, Mehrgenerationenfamilien, Alleinstehende und Alleinerziehende, Patchwork- und Stieffamilien sowie gleichgeschlechtliche Paare und Eltern. Für die letztgenannte Gruppe konzentriert sich die bisherige Forschung jedoch relativ eng auf queere Menschen in Partnerschaften (d. h. Menschen, die sich als lesbisch, schwul, bisexuell oder queer identifizieren oder eine andere nicht-heterosexuelle Orientierung haben). Das Projekt erweitert diesen Blick, indem es stattdessen die sozialen und verwandtschaftlichen Netzwerke queerer Menschen in den Mittelpunkt stellt, und schafft so eine bessere soziologische und demografische Evidenzbasis zu queeren und gewählten Verwandten."
      - "Das Projekt fragt neu, wer als verwandt gilt und wie Menschen Verwandtschaft erleben. Die Begriffe „Familie“ und „Verwandte“ werden hier synonym für Beziehungen verwendet, die auf biologischen oder rechtlichen Bindungen (z. B. Adoption, Ehe) beruhen; sie umfassen sowohl die Kernfamilie (d. h. Eltern und Kinder) als auch Beziehungen in der erweiterten Familie (z. B. Cousins und Cousinen, Großeltern). Das Projekt unterscheidet zwischen „gewählten“ und „nicht gewählten“ Verwandten. Erstere bezeichnen ein nichtbiologisches, nicht rechtlich begründetes Netzwerk, das ähnliche Unterstützung bietet, wie sie typischerweise eine Familie leistet – wobei durchaus auch viele „nicht gewählte“ Verwandte Teil einer „Wahlfamilie“ sein können."
      - "Das erste Ziel des Projekts ist es, die familiären Bindungen und Beziehungen queerer Menschen zu verstehen. Zwar gibt es zunehmend Forschung zum Einfluss erweiterter Verwandter, insbesondere von Tanten sowie Cousins und Cousinen, auf das Leben queerer Menschen, doch ist wenig darüber bekannt, wie viele queere Verwandte ein Mensch erwarten kann und wie diese Zahl nach Verwandtschaftstyp und Geschlecht variiert. Auch die Qualität der familiären Bindungen queerer Menschen (einschließlich des Austauschs von Ressourcen, Unterstützung und Fürsorge) ist bislang wenig verstanden, insbesondere im europäischen Kontext. Das Projekt liefert neue Erkenntnisse über queere Verwandtschaft, indem es die erweiterten Verwandtschaftsnetzwerke queerer Menschen sowohl quantitativ erfasst (d. h. ihre Zahl und Struktur bestimmt) als auch qualitativ beschreibt (d. h. Ressourcen- und Fürsorgetransfers, Beziehungsqualität sowie inter- und intragenerationelle Unterstützung untersucht)."
      - "Das zweite Ziel besteht darin, die Rolle gewählter Verwandter im Leben queerer Menschen zu untersuchen. Obwohl die Akzeptanz sexueller Minderheiten weltweit zunimmt, erleben queere Menschen nach wie vor häufiger als heterosexuelle Menschen eine Entfremdung von ihrer Familie und soziale Ausgrenzung, was oft dazu führt, dass sie stärker auf gewählte Verwandte angewiesen sind. Das Projekt erweitert die bisherige Forschung, indem es die Rolle gewählter Verwandter in verschiedenen Lebensphasen sowie in unterschiedlichen sozialen und rechtlichen Kontexten untersucht."
      - "Vor dem Hintergrund der Bevölkerungsalterung und schrumpfender Verwandtschaftsstrukturen zeigt das Projekt „Queer and Chosen Kinship“, wie Unterstützung und Solidarität auch außerhalb der heterosexuellen Kernfamilie bestehen können. Seine Ergebnisse können als Grundlage für politische Maßnahmen dienen, die auf eine stärkere Einbeziehung vielfältiger Familienformen abzielen. Darüber hinaus erweitert das Projekt unser theoretisches Verständnis davon, welche Rolle das soziale und rechtliche Umfeld für die sozialen und verwandtschaftlichen Bindungen queerer Menschen in unterschiedlichen Kontexten spielt."
